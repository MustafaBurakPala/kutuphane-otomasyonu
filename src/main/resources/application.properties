spring.config.import=optional:classpath:application-local.properties
spring.application.name=kutuphane
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:14330;databaseName=Kutuphane;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=false}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.community.dialect.SQLServerLegacyDialect
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=127.0.0.1
server.servlet.session.tracking-modes=cookie


server.error.include-stacktrace=never
server.error.include-message=never
